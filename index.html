<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Simulador PME 2026</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1f33;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{width:min(460px,100%);text-align:center}
    .spinner{width:48px;height:48px;margin:0 auto 20px;border:5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    h1{font-size:28px;margin:0 0 10px}p{opacity:.8;line-height:1.5}.progress{height:7px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:20px}.progress div{height:100%;width:3%;background:#59b6ec;transition:width .2s}
    .error{display:none;background:#fff;color:#14202c;padding:22px;border-radius:17px;text-align:left}.error strong{font-size:20px}.detail{font-size:12px;color:#657487;word-break:break-word}
  </style>
</head>
<body>
<main>
  <div class="box" id="loading">
    <div class="spinner"></div>
    <h1>Simulador PME 2026</h1>
    <p id="status">Cargando el banco ampliado…</p>
    <div class="progress"><div id="bar"></div></div>
  </div>
  <div class="box error" id="error">
    <strong>No se ha podido abrir el simulador.</strong>
    <p>Recarga la página. Si continúa, abre el enlace directamente en Safari, Chrome, Edge o Firefox.</p>
    <p class="detail" id="detail"></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="app-v1500/loader.js?v=20260804h-unique-study"></script>
</body>
</html>
