<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#0b1f33">
  <title>Cargando simulador PME 2026…</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1f33;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
    .box{max-width:420px}.spin{width:42px;height:42px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}p{opacity:.82;line-height:1.45}.error{display:none;background:#fff;color:#111;padding:18px;border-radius:14px;text-align:left}
  </style>
</head>
<body>
<main>
  <div class="box" id="loading"><div class="spin"></div><h1>Simulador PME 2026</h1><p>Cargando el banco de 1.000 preguntas…</p></div>
  <div class="error" id="error"><strong>No se ha podido abrir el simulador.</strong><p>Actualiza Safari/iOS y vuelve a cargar esta página.</p></div>
</main>
  <script src="data/chunk-00.js"></script>
  <script src="data/chunk-01.js"></script>
  <script src="data/chunk-02.js"></script>
  <script src="data/chunk-03.js"></script>
  <script src="data/chunk-04.js"></script>
  <script src="data/chunk-05.js"></script>
  <script src="data/chunk-06.js"></script>
  <script src="data/chunk-07.js"></script>
  <script src="data/chunk-08.js"></script>
  <script src="data/chunk-09.js"></script>
  <script src="data/chunk-10.js"></script>
<script>
(async()=>{try{
  const data=(window.PME_DATA||[]).join('');
  const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window)) throw new Error('DecompressionStream no disponible');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
}catch(e){console.error(e);document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';}})();
</script>
</body>
</html>
