<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#0b1f33">
  <title>Simulador PME 2026</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1f33;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
    .box{max-width:440px}.spin{width:42px;height:42px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}p{opacity:.82;line-height:1.45}.error{display:none;background:#fff;color:#111;padding:18px;border-radius:14px;text-align:left}.detail{font-size:13px;word-break:break-word;color:#555}
  </style>
</head>
<body>
<main>
  <div class="box" id="loading"><div class="spin"></div><h1>Simulador PME 2026</h1><p id="status">Cargando el banco de 1.000 preguntas…</p></div>
  <div class="error" id="error"><strong>No se ha podido abrir el simulador.</strong><p>Recarga la página. Si continúa, abre el enlace directamente en Safari.</p><p class="detail" id="detail"></p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="data/chunk-00.js"></script>
<script src="data/chunk-01.js"></script>
<script src="data/chunk-02.js"></script>
<script src="data/chunk-03.js"></script>
<script src="data/chunk-04.js"></script>
<script>
(async()=>{try{
  const parts=window.PME_DATA||[];
  if(parts.length!==5) throw new Error('No se han cargado todos los archivos de datos ('+parts.length+'/5)');
  const data=parts.join('');
  const binary=atob(data);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  let html;
  if('DecompressionStream' in window){
    document.getElementById('status').textContent='Preparando el simulador…';
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    html=await new Response(stream).text();
  }else if(window.pako){
    document.getElementById('status').textContent='Preparando el simulador para este navegador…';
    html=new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));
  }else{
    throw new Error('El navegador no permite descomprimir los datos');
  }
  if(!html.includes('const BANK=')||html.length<500000) throw new Error('Los datos del simulador están incompletos');
  document.open();document.write(html);document.close();
}catch(e){
  console.error(e);
  document.getElementById('loading').style.display='none';
  document.getElementById('error').style.display='block';
  document.getElementById('detail').textContent=String(e&&e.message?e.message:e);
}})();
</script>
</body>
</html>
