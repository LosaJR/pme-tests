name: Construir simulador auditado

on:
  push:
    branches:
      - auditoria-banco-preguntas
    paths:
      - 'payload-v4/**'
      - '.github/workflows/build-audited-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reconstruir y validar el sitio
        shell: bash
        run: |
          set -euo pipefail
          cat payload-v4/part-* > /tmp/pme-site.b64
          base64 --decode /tmp/pme-site.b64 > /tmp/pme-site.tar.gz
          tar -xzf /tmp/pme-site.tar.gz

          test -s index.html
          test -s assets/app.css
          test -s assets/app-0.js
          test -s assets/app-1.js
          test -s assets/app-2.js
          test -s assets/app-3.js
          test -s bank/concepts-00.js
          test -s bank/concepts-04.js
          test -s bank/manifest.json
          test -s audit/AUDITORIA_COMPLETA.md
          test -s audit/summary.json

          grep -q 'assets/app-3.js' index.html
          grep -q 'window.PME_CONCEPT_PARTS' bank/concepts-00.js
          grep -q '00753e0039c015e59c7fb89d214d23f405817ff2494d084381c7b3e10181ee7d' bank/manifest.json

          node --check assets/app-0.js
          node --check assets/app-1.js
          node --check assets/app-2.js
          node --check assets/app-3.js

      - name: Guardar versión auditada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets bank audit README.md
          if git diff --cached --quiet; then
            echo 'No hay cambios que guardar.'
            exit 0
          fi
          git commit -m 'Construir sitio auditado completo'
          git push
